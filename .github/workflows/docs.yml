name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'README.md'
      - 'Doxyfile'
      - 'src/header_sources/**'
      - 'tools/generate_headers.py'
      - '.gitattributes'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'README.md'
      - 'Doxyfile'
      - 'src/header_sources/**'
      - 'tools/generate_headers.py'
      - '.gitattributes'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated headers
        run: python -X utf8 tools/generate_headers.py --check

      - name: Cache Doxygen
        id: cache-doxygen
        uses: actions/cache@v4
        with:
          path: doxygen-1.17.0
          key: doxygen-1.17.0-linux-x64

      - name: Install Doxygen 1.17.0 & Graphviz
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz
          tar xzf doxygen-1.17.0.linux.bin.tar.gz

      - name: Setup PATH & Graphviz
        run: |
          echo "$PWD/doxygen-1.17.0/bin" >> $GITHUB_PATH
          sudo apt-get install -y graphviz

      - name: Sync PROJECT_NUMBER from CMakeLists.txt
        run: |
          VERSION=$(grep -oP 'project\(RandX VERSION \K[0-9.]+' CMakeLists.txt)
          echo "提取到版本号: $VERSION"
          sed -i "s/^PROJECT_NUMBER.*/PROJECT_NUMBER = $VERSION/" Doxyfile

      - name: Generate Docs
        run: doxygen Doxyfile

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/api/html
          publish_branch: gh-pages
          force_orphan: true
