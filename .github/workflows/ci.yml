          done
      - uses: actions/upload-artifact@v4
        with:
          name: entropy-contracts-clang-${{ matrix.std }}
          path: entropy-contracts/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-contracts-clang-${{ matrix.std }}
          path: contracts/*.json
      - uses: actions/upload-artifact@v4
        if: matrix.std != 'c++20'
        with:
          name: default-engine-contracts-clang-${{ matrix.std }}
          path: default-engine-contracts/*.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sampling-comparison-clang-${{ matrix.std }}
          path: sampling-comparisons/
          if-no-files-found: ignore

  msvc:
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      matrix:
        std: [c++17, c++20, c++23]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sampling baseline commit is available
        shell: pwsh
        run: git cat-file -e "$($env:RANDX_SAMPLING_BASELINE_REF)^{commit}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      - name: Build (C++23 with doctest)
        if: matrix.std == 'c++23'
        shell: cmd
        run: cl /std:c++23preview /utf-8 /W4 /EHsc /Od /I third_party /Fe:test_randx.exe test_randx.cpp
      - name: Test (C++23 with doctest)
        if: matrix.std == 'c++23'
        timeout-minutes: 3
        shell: cmd
        run: test_randx.exe
      - name: Build & Test (C++23 with doctest, release mode)
        if: matrix.std == 'c++23'
        timeout-minutes: 5
        shell: cmd
        run: |
          cl /std:c++23preview /utf-8 /W4 /EHsc /O2 /DNDEBUG /I third_party /Fe:test_randx_release.exe test_randx.cpp
          test_randx_release.exe
      - name: Build quick benchmark
        if: matrix.std == 'c++23'
        shell: cmd
        run: cl /std:c++23preview /utf-8 /W4 /EHsc /O2 /Fe:benchmark.exe benchmark.cpp
      - name: Build (C++17 with doctest)
        if: matrix.std == 'c++17'
        shell: cmd
        run: cl /std:c++17 /utf-8 /W4 /EHsc /Od /I third_party /Fe:test_randx_cpp17.exe test_randx_cpp17.cpp
      - name: Test (C++17 with doctest)
        if: matrix.std == 'c++17'
        timeout-minutes: 3
        shell: cmd
        run: test_randx_cpp17.exe
      - name: Build & Test (C++17 with doctest, release mode)
        if: matrix.std == 'c++17'
        timeout-minutes: 5
        shell: cmd
        run: |
          cl /std:c++17 /utf-8 /W4 /EHsc /O2 /DNDEBUG /I third_party /Fe:test_randx_cpp17_release.exe test_randx_cpp17.cpp
          test_randx_cpp17_release.exe
      - name: Build (C++20 char8_t coverage)
        if: matrix.std == 'c++20'
        shell: cmd
        run: cl /std:c++20 /utf-8 /W4 /EHsc /Od /I third_party /Fe:test_randx_cpp17.exe test_randx_cpp17.cpp
      - name: Test (C++20 char8_t coverage)
        if: matrix.std == 'c++20'
        timeout-minutes: 3
        shell: cmd
        run: test_randx_cpp17.exe
      - name: Run tests with fixed randomized order (C++17)
        if: matrix.std == 'c++17'
        shell: cmd
        run: |
          test_randx_cpp17.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
          test_randx_cpp17_release.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
      - name: Run tests with fixed randomized order (C++20)
        if: matrix.std == 'c++20'
        shell: cmd
        run: test_randx_cpp17.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED%
      - name: Run tests with fixed randomized order (C++23)
        if: matrix.std == 'c++23'
        shell: cmd
        run: |
          test_randx.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
          test_randx_release.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
      - name: 构建并运行生产默认引擎套件
        if: matrix.std != 'c++20'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path default-engine-build | Out-Null
          $standard = '${{ matrix.std }}'
          if ($standard -eq 'c++23') {
            $entry = 'tests/default_engine/test_default_engine_cpp23.cpp'
            $variant = 'cpp23'
            $standardFlag = '/std:c++23preview'
            $entryFlags = @()
          } else {
            $entry = 'tests/default_engine/test_default_engine_cpp17.cpp'
            $variant = 'cpp17'
            $standardFlag = '/std:c++17'
            $entryFlags = @('/DRANDX_DEFAULT_ENGINE_TEST_CPP17')
          }
          $sources = @($entry, 'tests/default_engine/default_engine_cross_translation_unit.cpp')
          foreach ($buildMode in @('debug', 'release')) {
            [string[]] $optimizationFlags = if ($buildMode -eq 'debug') { @('/Od') } else { @('/O2', '/DNDEBUG') }
            $binary = "default-engine-build/test_default_engine_${buildMode}.exe"
            & cl $standardFlag /utf-8 /W4 /EHsc @optimizationFlags /I third_party /I . `
              @entryFlags "/Fe:$binary" @sources
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\$binary"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\$binary" --order-by=rand "--rand-seed=$env:RANDX_DOCTEST_ORDER_SEED"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and run entropy failure tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path entropy-build | Out-Null
          $standard = '${{ matrix.std }}'
          if ($standard -eq 'c++23') {
            $entry = 'tests/entropy/test_entropy_cpp23.cpp'
            $variant = 'cpp23'
            $standardFlag = '/std:c++23preview'
            $hookFlags = @('/DRANDX_ENABLE_ENTROPY_TEST_HOOKS')
          } else {
            $entry = 'tests/entropy/test_entropy_cpp17.cpp'
            $variant = 'cpp17'
            $standardFlag = if ($standard -eq 'c++20') { '/std:c++20' } else { '/std:c++17' }
            $hookFlags = @('/DRANDX_ENABLE_ENTROPY_TEST_HOOKS', '/DRANDX_ENTROPY_TEST_CPP17', '/DRANDX_DEFAULT_ENGINE_TEST_CPP17')
          }
          $sources = @($entry, 'tests/entropy/entropy_cross_translation_unit.cpp', 'tests/default_engine/default_engine_cross_translation_unit.cpp')
          foreach ($buildMode in @('debug', 'release')) {
            [string[]] $optimizationFlags = if ($buildMode -eq 'debug') { @('/Od') } else { @('/O2', '/DNDEBUG') }
            $binary = "entropy-build/test_entropy_${buildMode}.exe"
            & cl $standardFlag /utf-8 /W4 /EHsc @optimizationFlags /I third_party /I . `
              @hookFlags "/Fe:$binary" @sources
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\$binary"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\$binary" --order-by=rand "--rand-seed=$env:RANDX_DOCTEST_ORDER_SEED"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 核对生产默认引擎与熵源 hook 注册一致
        if: matrix.std != 'c++20'
        shell: pwsh
        run: |
          $comparisonStatus = 0
          foreach ($buildMode in @('debug', 'release')) {
            $productionBinary = "default-engine-build/test_default_engine_${buildMode}.exe"
            $hookBinary = "entropy-build/test_entropy_${buildMode}.exe"
            python tools/check_test_contracts.py compare-binaries `
              --cpp17-binary $productionBinary `
              --cpp23-binary $hookBinary `
              --suite '公共/基础/默认引擎'
            if ($LASTEXITCODE -gt $comparisonStatus) { $comparisonStatus = $LASTEXITCODE }
          }
          exit $comparisonStatus
      - name: Compare sampling behavior against the source baseline
        shell: pwsh
        run: |
          $comparisonStatus = 0
          $buildModes = @('debug', 'release')
          foreach ($buildMode in $buildModes) {
            python tools/compare_sampling.py `
              --baseline-ref $env:RANDX_SAMPLING_BASELINE_REF `
              --candidate-root . `
              --compiler cl `
              --compiler-family msvc `
              --standard '${{ matrix.std }}' `
              --build-mode $buildMode `
              --output-dir "sampling-comparisons/msvc-${{ matrix.std }}-$buildMode"
            if ($LASTEXITCODE -gt $comparisonStatus) { $comparisonStatus = $LASTEXITCODE }
          }
          exit $comparisonStatus
      - name: Collect registry manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path contracts | Out-Null
          $standard = '${{ matrix.std }}'
          if ($standard -eq 'c++23') {
            $target = 'test_randx.exe'
            $variant = 'cpp23'
          } else {
            $target = 'test_randx_cpp17.exe'
            $variant = 'cpp17'
          }
          python tools/check_test_contracts.py collect --binary $target --compiler msvc --platform windows-2025 --standard $standard --build-mode debug --variant $variant --output "contracts/msvc-$standard-debug-$variant.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($standard -ne 'c++20') {
            if ($standard -eq 'c++23') {
              $target = 'test_randx_release.exe'
              $variant = 'cpp23'
            } else {
              $target = 'test_randx_cpp17_release.exe'
              $variant = 'cpp17'
            }
            python tools/check_test_contracts.py collect --binary $target --compiler msvc --platform windows-2025 --standard $standard --build-mode release --variant $variant --output "contracts/msvc-$standard-release-$variant.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 收集生产默认引擎套件清单
        if: matrix.std != 'c++20'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path default-engine-contracts | Out-Null
          $standard = '${{ matrix.std }}'
          if ($standard -eq 'c++23') { $variant = 'cpp23' } else { $variant = 'cpp17' }
          foreach ($buildMode in @('debug', 'release')) {
            $binary = "default-engine-build/test_default_engine_${buildMode}.exe"
            python tools/check_test_contracts.py collect `
              --binary $binary --compiler msvc --platform windows-2025 `
              --standard $standard --build-mode $buildMode --variant $variant `
              --output "default-engine-contracts/msvc-$standard-$buildMode-$variant.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Collect entropy failure manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path entropy-contracts | Out-Null
          $standard = '${{ matrix.std }}'
          if ($standard -eq 'c++23') { $variant = 'cpp23' } else { $variant = 'cpp17' }
          foreach ($buildMode in @('debug', 'release')) {
            $binary = "entropy-build/test_entropy_${buildMode}.exe"
            python tools/check_test_contracts.py collect `
              --binary $binary --compiler msvc --platform windows-2025 `
              --standard $standard --build-mode $buildMode --variant $variant `
              --output "entropy-contracts/msvc-$standard-$buildMode-$variant.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: entropy-contracts-msvc-${{ matrix.std }}
          path: entropy-contracts/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-contracts-msvc-${{ matrix.std }}
          path: contracts/*.json
      - uses: actions/upload-artifact@v4
        if: matrix.std != 'c++20'
        with:
          name: default-engine-contracts-msvc-${{ matrix.std }}
          path: default-engine-contracts/*.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sampling-comparison-msvc-${{ matrix.std }}
          path: sampling-comparisons/
          if-no-files-found: ignore

  entropy-macos:
    name: macOS entropy integration
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Apple Clang
        run: clang++ --version
      - name: Build and run entropy failure targets
        run: |
          mkdir -p entropy-build entropy-contracts
          clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -I . -I third_party \
            -DRANDX_ENABLE_ENTROPY_TEST_HOOKS -DRANDX_ENTROPY_TEST_CPP17 -DRANDX_DEFAULT_ENGINE_TEST_CPP17 \
            -o entropy-build/test_entropy_cpp17 \
            tests/entropy/test_entropy_cpp17.cpp tests/entropy/entropy_cross_translation_unit.cpp \
            tests/default_engine/default_engine_cross_translation_unit.cpp \
            -framework Security
          ./entropy-build/test_entropy_cpp17
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -I . -I third_party \
            -DRANDX_ENABLE_ENTROPY_TEST_HOOKS \
            -o entropy-build/test_entropy_cpp23 \
            tests/entropy/test_entropy_cpp23.cpp tests/entropy/entropy_cross_translation_unit.cpp \
            tests/default_engine/default_engine_cross_translation_unit.cpp \
            -framework Security
          ./entropy-build/test_entropy_cpp23
      - name: Collect independent entropy manifests
        run: |
          python3 tools/check_test_contracts.py collect \
            --binary entropy-build/test_entropy_cpp17 --compiler apple-clang --platform macos-15 \
            --standard c++17 --build-mode release --variant cpp17 \
            --output entropy-contracts/macos-15-c++17-release-cpp17.json
          python3 tools/check_test_contracts.py collect \
            --binary entropy-build/test_entropy_cpp23 --compiler apple-clang --platform macos-15 \
            --standard c++23 --build-mode release --variant cpp23 \
            --output entropy-contracts/macos-15-c++23-release-cpp23.json
      - uses: actions/upload-artifact@v4
        with:
          name: entropy-contracts-macos
          path: entropy-contracts/*.json
      - name: Build ordinary security tests with Security framework
        run: |
          clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -I . -I third_party \
            -o entropy-build/test_security_cpp17 tests/entropy/test_security_cpp17.cpp -framework Security
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -I . -I third_party \
            -o entropy-build/test_security_cpp23 tests/entropy/test_security_cpp23.cpp -framework Security
      - name: Run selected real OS entropy tests
        run: |
          for binary in ./entropy-build/test_security_cpp17 ./entropy-build/test_security_cpp23; do
            python3 tools/check_test_contracts.py run-selected --binary "$binary" \
              --test-case "SecureRandomBytes 填充缓冲区" \
              --test-case "SecureSeed 返回不同值" \
              --test-case "ChaCha20 默认构造成功初始化（OS 熵可用时）"
          done

  secure-wipe-capabilities:
    name: Secure wipe capabilities (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: [header-generation-ubuntu, header-generation-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            compiler: gcc
            label: GCC
          - runner: ubuntu-24.04
            compiler: clang
            label: Clang
          - runner: macos-15
            compiler: apple-clang
            label: Apple Clang
          - runner: windows-2025
            compiler: msvc
            label: MSVC
          - runner: windows-2025
            compiler: mingw
            label: MinGW GCC
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW GCC
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja
      - name: Configure capability targets
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          cmake -S . -B build/secure-wipe -DRANDX_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
      - name: Configure capability targets
        if: matrix.compiler == 'apple-clang'
        shell: bash
        run: cmake -S . -B build/secure-wipe -DRANDX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Configure capability targets with Clang
        if: matrix.compiler == 'clang'
        run: cmake -S . -B build/secure-wipe -DRANDX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-18
      - name: Configure capability targets with MSVC
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build/secure-wipe -DRANDX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Configure capability targets with MinGW
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake -S . -B build/secure-wipe -G Ninja -DRANDX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build GCC, MSVC and MinGW capability targets
        if: matrix.compiler == 'gcc' || matrix.compiler == 'clang' || matrix.compiler == 'msvc'
        run: cmake --build build/secure-wipe --config Release --target test_secure_wipe_capabilities_cpp17_native test_secure_wipe_capabilities_cpp17_portable test_secure_wipe_capabilities_cpp23_native test_secure_wipe_capabilities_cpp23_portable
      - name: Build MinGW capability targets
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake --build build/secure-wipe --config Release --target test_secure_wipe_capabilities_cpp17_native test_secure_wipe_capabilities_cpp17_portable test_secure_wipe_capabilities_cpp23_native test_secure_wipe_capabilities_cpp23_portable
      - name: Build Apple default, opt-in and portable capability targets
        if: matrix.compiler == 'apple-clang'
        shell: bash
        run: cmake --build build/secure-wipe --config Release --target test_secure_wipe_capabilities_cpp17_apple_default test_secure_wipe_capabilities_cpp17_apple_optin test_secure_wipe_capabilities_cpp17_portable test_secure_wipe_capabilities_cpp23_apple_default test_secure_wipe_capabilities_cpp23_apple_optin test_secure_wipe_capabilities_cpp23_portable
      - name: Run capability tests
        if: matrix.compiler != 'mingw'
        run: ctest --test-dir build/secure-wipe -C Release -R '^test_secure_wipe_capabilities_' --output-on-failure
      - name: Run MinGW capability tests
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build/secure-wipe -C Release -R '^test_secure_wipe_capabilities_' --output-on-failure
      - name: Build triangular contracts and observations
        if: matrix.compiler != 'mingw'
        run: cmake --build build/secure-wipe --config Release --target test_triangular_cpp17 test_triangular_cpp23 gen_triangular_cpp17 gen_triangular_cpp23 --parallel 1
      - name: Build MinGW triangular contracts and observations
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake --build build/secure-wipe --config Release --target test_triangular_cpp17 test_triangular_cpp23 gen_triangular_cpp17 gen_triangular_cpp23 --parallel 1
      - name: Run triangular contracts and observations
        if: matrix.compiler != 'mingw'
        run: ctest --test-dir build/secure-wipe -C Release -R '^test_triangular_' --output-on-failure
      - name: Run MinGW triangular contracts and observations
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build/secure-wipe -C Release -R '^test_triangular_' --output-on-failure
      - name: Upload capability and triangular binaries and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-wipe-capabilities-${{ matrix.compiler }}
          path: build/secure-wipe/
          if-no-files-found: ignore

  secure-wipe-codegen:
    name: Secure wipe final binary audit (MinGW GCC)
    runs-on: windows-2025
    needs: [header-generation-ubuntu, header-generation-windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: audit-python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: Audit final linked binaries and all wipe mutations
        shell: msys2 {0}
        env:
          AUDIT_PYTHON: ${{ steps.audit-python.outputs.python-path }}
        run: |
          "$(cygpath -u "$AUDIT_PYTHON")" tools/check_secure_wipe_codegen.py \
            --compiler "$(cygpath -w "$(command -v g++)")" \
            --disassembler "$(cygpath -w "$(command -v objdump)")" \
            --standard both --optimization both --backend both --verify-mutations \
            --output-dir build/secure-wipe-audit
      - name: Upload machine code evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-wipe-final-binary-evidence
          path: build/secure-wipe-audit/

  # 跨标准序列一致性检查：同一生成器分别以 C++23（RandX.hpp）与
  # C++17（RandX_Cpp17.hpp）编译，固定种子输出各引擎与便捷 API 序列后逐字节比对，
  # 机械保证「双头文件输出序列完全一致」不变量（KAT 测试保持不变，独立于本 job）
  parity:
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check GCC 14
        run: g++-14 --version
      - name: Build parity generators (C++23 + C++17)
        run: |
          g++-14 -std=c++23 -O2 -Wall -Wextra -I . \
            -o gen_parity_cpp23 gen_parity_sequences.cpp
          g++-14 -std=c++17 -O2 -Wall -Wextra -I . -DRANDX_PARITY_CPP17 \
            -o gen_parity_cpp17 gen_parity_sequences.cpp
      - name: Generate & compare sequences byte-by-byte
        run: |
          ./gen_parity_cpp23 > seq_cpp23.txt
          ./gen_parity_cpp17 > seq_cpp17.txt
          cmp seq_cpp23.txt seq_cpp17.txt
          echo "Cross-standard sequences are byte-identical ($(wc -c < seq_cpp23.txt) bytes)"
      - name: Upload sequences on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-sequences
          path: |
            seq_cpp23.txt
            seq_cpp17.txt

  # 示例编译冒烟检查：以 -DRANDX_BUILD_EXAMPLES=ON 构建 examples/ 全部示例
  # 与 gen_sequences.cpp，仅验证可编译，不运行
  examples:
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check GCC 14
        run: g++-14 --version
      - name: Configure & build examples
        run: |
          cmake -B build -DRANDX_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build

  coverage:
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RANDX_LCOV_VERSION: '2.5'
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          g++-14 --version
          sudo apt-get update
          sudo apt-get install -y lcov libdatetime-perl libdevel-stacktrace-perl libperlio-gzip-perl
          gh release download "v${RANDX_LCOV_VERSION}" --repo linux-test-project/lcov \
            --pattern "lcov-${RANDX_LCOV_VERSION}.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/lcov-${RANDX_LCOV_VERSION}.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lcov-${RANDX_LCOV_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lcov-${RANDX_LCOV_VERSION}/bin/lcov" --version
      - name: Verify production preprocessor configuration
        run: |
          mkdir -p coverage-evidence
          python3 tools/check_entropy_preprocessor.py \
            --compiler g++-14 --standard c++17 --header RandX_Cpp17.hpp \
            --output coverage-evidence/RandX-C++17.i
          python3 tools/check_entropy_preprocessor.py \
            --compiler g++-14 --standard c++20 --header RandX_Cpp17.hpp \
            --output coverage-evidence/RandX-C++20.i
          python3 tools/check_entropy_preprocessor.py \
            --compiler g++-14 --standard c++23 --header RandX.hpp \
            --output coverage-evidence/RandX-C++23.i
      - name: Build production and fault coverage in separate directories
        run: |
          mkdir -p coverage-production coverage-entropy
          g++-14 -std=c++23 -O0 -g --coverage -I third_party \
            -o coverage-production/test_randx test_randx.cpp
          g++-14 -std=c++17 -O0 -g --coverage -I third_party \
            -o coverage-production/test_randx_cpp17 test_randx_cpp17.cpp
          g++-14 -std=c++23 -O0 -g --coverage -pthread -I . -I third_party \
            -o coverage-production/test_default_engine_cpp23 \
            tests/default_engine/test_default_engine_cpp23.cpp \
            tests/default_engine/default_engine_cross_translation_unit.cpp
          g++-14 -std=c++17 -O0 -g --coverage -pthread -I . -I third_party \
            -DRANDX_DEFAULT_ENGINE_TEST_CPP17 \
            -o coverage-production/test_default_engine_cpp17 \
            tests/default_engine/test_default_engine_cpp17.cpp \
            tests/default_engine/default_engine_cross_translation_unit.cpp
          g++-14 -std=c++23 -O0 -g --coverage -pthread -I . -I third_party \
            -DRANDX_ENABLE_ENTROPY_TEST_HOOKS \
            -o coverage-entropy/test_entropy_cpp23 \
            tests/entropy/test_entropy_cpp23.cpp tests/entropy/entropy_cross_translation_unit.cpp \
            tests/default_engine/default_engine_cross_translation_unit.cpp
          g++-14 -std=c++17 -O0 -g --coverage -pthread -I . -I third_party \
            -DRANDX_ENABLE_ENTROPY_TEST_HOOKS -DRANDX_ENTROPY_TEST_CPP17 -DRANDX_DEFAULT_ENGINE_TEST_CPP17 \
            -o coverage-entropy/test_entropy_cpp17 \
            tests/entropy/test_entropy_cpp17.cpp tests/entropy/entropy_cross_translation_unit.cpp \
            tests/default_engine/default_engine_cross_translation_unit.cpp
      - name: Run production and fault coverage tests
        run: |
          ./coverage-production/test_randx
          ./coverage-production/test_randx_cpp17
          ./coverage-production/test_default_engine_cpp23
          ./coverage-production/test_default_engine_cpp17
          ./coverage-entropy/test_entropy_cpp23
          ./coverage-entropy/test_entropy_cpp17
      - name: Build and run secure wipe capability coverage
        run: |
          cmake -S . -B coverage-security -DRANDX_BUILD_TESTS=ON \
            -DRANDX_ENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-14
          cmake --build coverage-security --target \
            test_secure_wipe_capabilities_cpp17_native \
            test_secure_wipe_capabilities_cpp17_portable \
            test_secure_wipe_capabilities_cpp23_native \
            test_secure_wipe_capabilities_cpp23_portable
          ctest --test-dir coverage-security \
            -R '^test_secure_wipe_capabilities_' --output-on-failure
          lcov --ignore-errors inconsistent --capture --directory coverage-security \
            --output-file coverage-security/coverage.info --gcov-tool gcov-14 --branch-coverage \
            --include "$PWD/RandX.hpp" --include "$PWD/RandX_Cpp17.hpp"
          lcov --ignore-errors inconsistent --list coverage-security/coverage.info --branch-coverage
          lcov --ignore-errors inconsistent --summary coverage-security/coverage.info --branch-coverage
      - name: Generate independent coverage reports
        run: |
          # 使用 gcov-14 以匹配 g++-14 生成的 .gcda 格式（B43*），避免与系统 gcov-13（B33*）冲突
          lcov --ignore-errors inconsistent --capture --directory coverage-production \
            --output-file coverage-production/coverage.info --gcov-tool gcov-14 --branch-coverage \
            --include "$PWD/RandX.hpp" --include "$PWD/RandX_Cpp17.hpp"
          lcov --ignore-errors inconsistent --list coverage-production/coverage.info --branch-coverage
          lcov --ignore-errors inconsistent --summary coverage-production/coverage.info --branch-coverage
          lcov --ignore-errors inconsistent --capture --directory coverage-entropy \
            --output-file coverage-entropy/coverage.info --gcov-tool gcov-14 --branch-coverage \
            --include "$PWD/RandX.hpp" --include "$PWD/RandX_Cpp17.hpp"
          lcov --ignore-errors inconsistent --list coverage-entropy/coverage.info --branch-coverage
          lcov --ignore-errors inconsistent --summary coverage-entropy/coverage.info --branch-coverage
      - name: Report entropy branches and trace compatibility
        shell: bash
        run: |
          set +e
          python3 tools/inspect_entropy_coverage.py \
            --production-report coverage-production/coverage.info \
            --fault-report coverage-entropy/coverage.info \
            --entropy-output coverage-entropy/entropy-branches.txt \
            --compatibility-output coverage-evidence/coverage-compatibility.json
          compatibility_status=$?
          set -e
          if [[ "$compatibility_status" -eq 0 ]]; then
            lcov --ignore-errors inconsistent --add-tracefile coverage-production/coverage.info \
              --add-tracefile coverage-entropy/coverage.info \
              --output-file coverage-evidence/coverage-combined.info --branch-coverage
            lcov --ignore-errors inconsistent --list coverage-evidence/coverage-combined.info --branch-coverage
          elif [[ "$compatibility_status" -eq 3 ]]; then
            echo "Coverage layouts differ; separate production and fault reports remain authoritative."
          else
            exit "$compatibility_status"
          fi
      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --ignore-errors inconsistent --summary coverage-production/coverage.info --branch-coverage | grep -oP 'lines\.*:\s*\K[0-9.]+')
          echo "Line coverage: ${COVERAGE}%"
          awk "BEGIN { exit !(${COVERAGE} >= 80) }" || (echo "Coverage ${COVERAGE}% < 80%" && exit 1)
      - name: Upload production coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-production-report
          path: coverage-production/coverage.info
      - name: Upload entropy fault coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-entropy-fault-report
          path: |
            coverage-entropy/coverage.info
            coverage-entropy/entropy-branches.txt
      - name: Upload secure wipe coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-secure-wipe-report
          path: coverage-security/coverage.info
          if-no-files-found: ignore
      - name: Upload preprocessor and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entropy-coverage-evidence
          path: coverage-evidence/
      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./coverage-production/coverage.info
          fail_ci_if_error: false

  test-contracts:
    needs: [gcc, clang, msvc]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test registration manifest checker
        run: python3 -m unittest discover -s tools -p test_check_test_contracts.py
      - uses: actions/download-artifact@v4
        with:
          pattern: test-contracts-*
          path: contracts
          merge-multiple: true
      - name: Compare matrix registration manifests
        run: |
          python3 tools/check_test_contracts.py compare --manifest-dir contracts \
            --expected-group gcc-14 ubuntu-24.04 debug \
            --expected-group gcc-14 ubuntu-24.04 release \
            --expected-group clang-18 ubuntu-24.04 debug \
            --expected-group clang-18 ubuntu-24.04 release \
            --expected-group msvc windows-2025 debug \
            --expected-group msvc windows-2025 release

  default-engine-test-contracts:
    needs: [gcc, clang, msvc]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 检查默认引擎清单比较接线
        run: python3 -m unittest discover -s tools -p 'test_default_engine_ci_wiring.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: default-engine-contracts-*
          path: default-engine-contracts
          merge-multiple: true
      - name: 核对各标准、构建配置与平台的生产默认引擎清单
        run: |
          python3 tools/check_test_contracts.py compare --manifest-dir default-engine-contracts \
            --suite '公共/基础/默认引擎' \
            --expected-group gcc-14 ubuntu-24.04 debug \
            --expected-group gcc-14 ubuntu-24.04 release \
            --expected-group clang-18 ubuntu-24.04 debug \
            --expected-group clang-18 ubuntu-24.04 release \
            --expected-group msvc windows-2025 debug \
            --expected-group msvc windows-2025 release \
            --standard-pair-group gcc-14 ubuntu-24.04 debug \
            --standard-pair-group gcc-14 ubuntu-24.04 release \
            --standard-pair-group clang-18 ubuntu-24.04 debug \
            --standard-pair-group clang-18 ubuntu-24.04 release \
            --standard-pair-group msvc windows-2025 debug \
            --standard-pair-group msvc windows-2025 release

  entropy-test-contracts:
    needs: [gcc, clang, msvc, entropy-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: entropy-contracts-*
          path: entropy-contracts
          merge-multiple: true
      - name: Compare entropy suite manifests across platforms and standards
        run: |
          python3 tools/check_test_contracts.py compare --manifest-dir entropy-contracts \
            --suite '公共/基础/默认引擎' \
            --suite '公共/基础/安全熵源故障' --suite '内部/熵源' \
            --expected-group gcc-14 ubuntu-24.04 debug \
            --expected-group gcc-14 ubuntu-24.04 release \
            --expected-group clang-18 ubuntu-24.04 debug \
            --expected-group clang-18 ubuntu-24.04 release \
            --expected-group msvc windows-2025 debug \
            --expected-group msvc windows-2025 release \
            --expected-group apple-clang macos-15 release \
            --standard-pair-group apple-clang macos-15 release
