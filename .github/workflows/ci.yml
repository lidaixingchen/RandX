name: CI

on:
  push:
    branches: [master]
    paths:
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'README.md'
      - 'docs/**'
      - 'test_randx.cpp'
      - 'test_randx_cpp17.cpp'
      - 'gen_parity_sequences.cpp'
      - 'gen_sequences.cpp'
      - 'examples/**'
      - 'example.cpp'
      - 'benchmark.cpp'
      - 'benchmark_gbench.cpp'
      - 'benchmark_gbench_default_cpp23.cpp'
      - 'benchmark_gbench_default_cpp17.cpp'
      - 'benchmark_gbench_initialization.cpp'
      - 'benchmarks/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/**'
      - 'tools/**'
      - 'src/header_sources/**'
      - 'third_party/**'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [master]
    paths:
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'README.md'
      - 'docs/**'
      - 'test_randx.cpp'
      - 'test_randx_cpp17.cpp'
      - 'gen_parity_sequences.cpp'
      - 'gen_sequences.cpp'
      - 'examples/**'
      - 'example.cpp'
      - 'benchmark.cpp'
      - 'benchmark_gbench.cpp'
      - 'benchmark_gbench_default_cpp23.cpp'
      - 'benchmark_gbench_default_cpp17.cpp'
      - 'benchmark_gbench_initialization.cpp'
      - 'benchmarks/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/**'
      - 'tools/**'
      - 'src/header_sources/**'
      - 'third_party/**'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

# 固定 doctest 用例排序种子，只控制执行顺序，不参与 RandX 引擎播种。
env:
  RANDX_DOCTEST_ORDER_SEED: '20261001'
  RANDX_SAMPLING_BASELINE_REF: 'e0ce50a6c0dd5e3b5158efb1cbe17a68bd93edec'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-generation-ubuntu:
    name: Header generation checks (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run header generator unit tests
        run: python -X utf8 -m unittest discover -s tools -p 'test_*header*.py' -v
      - name: Check generated headers
        run: python -X utf8 tools/generate_headers.py --check
      - name: Verify shared-source diagnostic mapping
        run: python -X utf8 tools/check_header_maintenance.py --compiler g++ --artifact-dir build/header-maintenance

  header-generation-windows:
    name: Header generation checks (Windows)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run header generator unit tests
        run: python -X utf8 -m unittest discover -s tools -p 'test_*header*.py' -v
      - name: Check generated headers
        run: python -X utf8 tools/generate_headers.py --check

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PractRand driver test suite
        run: |
          python3 -m unittest discover \
            -s tools/pract_rand/tests \
            -p 'test_*.py' -v
      - name: Run doctest contract and execution checker unit tests
        run: python3 -m unittest discover -s tools -p 'test_check_test_contracts.py' -v
      - name: Run production entropy preprocessor unit tests
        run: python3 -m unittest discover -s tools -p 'test_check_entropy_preprocessor.py' -v
      - name: Run entropy coverage report unit tests
        run: python3 -m unittest discover -s tools -p 'test_inspect_entropy_coverage.py' -v
      - name: Run sampling comparison tool unit tests
        run: python3 -m unittest discover -s tools -p 'test_compare_sampling.py' -v
      - name: Run benchmark comparison unit tests
        run: python3 -m unittest discover -s tools -p 'test_compare_benchmark.py' -v
      - name: Run benchmark aggregation unit tests
        run: python3 -m unittest discover -s tools -p 'test_merge_benchmark_repetitions.py' -v
      - name: Run sampling benchmark confirmation unit tests
        run: python3 -m unittest discover -s tools -p 'test_confirm_sampling_benchmark.py' -v
      - name: Run benchmark gate unit tests
        run: python3 -m unittest discover -s tools -p 'test_benchmark_gate.py' -v
      - name: Run benchmark Actions adapter unit tests
        run: python3 -m unittest discover -s tools -p 'test_benchmark_actions.py' -v
      - name: Run benchmark issue notification tests
        run: node --test tools/test_benchmark_issue.cjs
      - name: Run benchmark group runner unit tests
        run: python3 -m unittest discover -s tools -p 'test_run_benchmark_group.py' -v
      - name: Run secure wipe code audit tool unit tests
        run: python3 -m unittest discover -s tools -p 'test_check_secure_wipe_codegen.py' -v
      - name: Run triangular reference generator tests
        run: |
          python3 -m unittest discover -s tools -p 'test_generate_triangular_reference.py' -v
          python3 tools/generate_triangular_reference.py --check
      - name: Run triangular benchmark record tests
        run: python3 -m unittest discover -s tools -p 'test_check_triangular_benchmark.py' -v

  gcc:
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        std: [c++17, c++20, c++23]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sampling baseline commit is available
        run: git cat-file -e "${RANDX_SAMPLING_BASELINE_REF}^{commit}"
      - name: Check GCC 14
        run: g++-14 --version
      - name: Build & Test (C++23 with doctest, assertions enabled)
        if: matrix.std == 'c++23'
        run: |
          g++-14 -std=c++23 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx test_randx.cpp
          ./test_randx
          g++-14 -std=c++23 -O2 -Wall -Wextra -o benchmark benchmark.cpp
      - name: Build & Test (C++23 with doctest, release mode)
        if: matrix.std == 'c++23'
        run: |
          g++-14 -std=c++23 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_release test_randx.cpp
          ./test_randx_release
      - name: Build & Test (C++17 with doctest, assertions enabled)
        if: matrix.std == 'c++17'
        run: |
          g++-14 -std=c++17 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++17 with doctest, release mode)
        if: matrix.std == 'c++17'
        run: |
          g++-14 -std=c++17 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Build & Test (C++20 char8_t coverage, assertions enabled)
        if: matrix.std == 'c++20'
        run: |
          g++-14 -std=c++20 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++20 char8_t coverage, release mode)
        if: matrix.std == 'c++20'
        run: |
          g++-14 -std=c++20 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Run tests with fixed randomized order
        run: |
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            ./test_randx --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
            ./test_randx_release --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          else
            ./test_randx_cpp17 --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
            ./test_randx_cpp17_release --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          fi
      - name: 构建并运行生产默认引擎套件
        if: matrix.std != 'c++20'
        run: |
          mkdir -p default-engine-build
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            entry="tests/default_engine/test_default_engine_cpp23.cpp"
            variant="cpp23"
            entry_flags=()
          else
            entry="tests/default_engine/test_default_engine_cpp17.cpp"
            variant="cpp17"
            entry_flags=(-DRANDX_DEFAULT_ENGINE_TEST_CPP17)
          fi
          for build_mode in debug release; do
            if [[ "$build_mode" == "debug" ]]; then
              mode_flags=(-D_GLIBCXX_ASSERTIONS)
            else
              mode_flags=(-DNDEBUG)
            fi
            binary="default-engine-build/test_default_engine_${build_mode}"
            g++-14 -std='${{ matrix.std }}' -O2 "${mode_flags[@]}" -Wall -Wextra -pthread \
              -I . -I third_party "${entry_flags[@]}" \
              -o "$binary" "$entry" tests/default_engine/default_engine_cross_translation_unit.cpp
            "$binary"
            "$binary" --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          done
      - name: Build and run entropy failure tests
        run: |
          mkdir -p entropy-build
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            entry="tests/entropy/test_entropy_cpp23.cpp"
            variant="cpp23"
            hook_flags=(-DRANDX_ENABLE_ENTROPY_TEST_HOOKS)
          else
            entry="tests/entropy/test_entropy_cpp17.cpp"
            variant="cpp17"
            hook_flags=(-DRANDX_ENABLE_ENTROPY_TEST_HOOKS -DRANDX_ENTROPY_TEST_CPP17 -DRANDX_DEFAULT_ENGINE_TEST_CPP17)
          fi
          for build_mode in debug release; do
            if [[ "$build_mode" == "debug" ]]; then
              mode_flags=(-D_GLIBCXX_ASSERTIONS)
            else
              mode_flags=(-DNDEBUG)
            fi
            g++-14 -std='${{ matrix.std }}' -O2 "${mode_flags[@]}" -Wall -Wextra -pthread \
              -I . -I third_party "${hook_flags[@]}" \
              -o "entropy-build/test_entropy_${build_mode}" \
              "$entry" tests/entropy/entropy_cross_translation_unit.cpp \
              tests/default_engine/default_engine_cross_translation_unit.cpp
            "entropy-build/test_entropy_${build_mode}"
            "entropy-build/test_entropy_${build_mode}" --order-by=rand \
              --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          done
      - name: 核对生产默认引擎与熵源 hook 注册一致
        if: matrix.std != 'c++20'
        run: |
          comparison_status=0
          for build_mode in debug release; do
            python3 tools/check_test_contracts.py compare-binaries \
              --cpp17-binary "default-engine-build/test_default_engine_${build_mode}" \
              --cpp23-binary "entropy-build/test_entropy_${build_mode}" \
              --suite '公共/基础/默认引擎' || {
                result=$?
                if (( result > comparison_status )); then comparison_status=$result; fi
              }
          done
          exit "$comparison_status"
      - name: Compare sampling behavior against the source baseline
        run: |
          comparison_status=0
          for build_mode in debug release; do
            python3 tools/compare_sampling.py \
              --baseline-ref "$RANDX_SAMPLING_BASELINE_REF" \
              --candidate-root . \
              --compiler g++-14 \
              --compiler-family gcc \
              --standard "${{ matrix.std }}" \
              --build-mode "$build_mode" \
              --output-dir "sampling-comparisons/gcc-${{ matrix.std }}-$build_mode" || {
                result=$?
                if (( result > comparison_status )); then comparison_status=$result; fi
              }
          done
          exit "$comparison_status"
      - name: Collect registry manifests
        run: |
          mkdir -p contracts
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            target="test_randx"
            variant="cpp23"
          else
            target="test_randx_cpp17"
            variant="cpp17"
          fi
          python3 tools/check_test_contracts.py collect \
            --binary "./${target}" --compiler gcc-14 --platform ubuntu-24.04 \
            --standard "${{ matrix.std }}" --build-mode debug --variant "${variant}" \
            --output "contracts/gcc-${{ matrix.std }}-debug-${variant}.json"
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            target="test_randx_release"
            variant="cpp23"
          else
            target="test_randx_cpp17_release"
            variant="cpp17"
          fi
          python3 tools/check_test_contracts.py collect \
            --binary "./${target}" --compiler gcc-14 --platform ubuntu-24.04 \
            --standard "${{ matrix.std }}" --build-mode release --variant "${variant}" \
            --output "contracts/gcc-${{ matrix.std }}-release-${variant}.json"
      - name: 收集生产默认引擎套件清单
        if: matrix.std != 'c++20'
        run: |
          mkdir -p default-engine-contracts
          if [[ "${{ matrix.std }}" == "c++23" ]]; then variant="cpp23"; else variant="cpp17"; fi
          for build_mode in debug release; do
            python3 tools/check_test_contracts.py collect \
              --binary "default-engine-build/test_default_engine_${build_mode}" \
              --compiler gcc-14 --platform ubuntu-24.04 \
              --standard "${{ matrix.std }}" --build-mode "$build_mode" --variant "$variant" \
              --output "default-engine-contracts/gcc-${{ matrix.std }}-${build_mode}-${variant}.json"
          done
      - name: Collect entropy failure manifests
        run: |
          mkdir -p entropy-contracts
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            variant="cpp23"
          else
            variant="cpp17"
          fi
          for build_mode in debug release; do
            python3 tools/check_test_contracts.py collect \
              --binary "entropy-build/test_entropy_${build_mode}" \
              --compiler gcc-14 --platform ubuntu-24.04 \
              --standard "${{ matrix.std }}" --build-mode "$build_mode" --variant "$variant" \
              --output "entropy-contracts/gcc-${{ matrix.std }}-${build_mode}-${variant}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: entropy-contracts-gcc-${{ matrix.std }}
          path: entropy-contracts/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-contracts-gcc-${{ matrix.std }}
          path: contracts/*.json
      - uses: actions/upload-artifact@v4
        if: matrix.std != 'c++20'
        with:
          name: default-engine-contracts-gcc-${{ matrix.std }}
          path: default-engine-contracts/*.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sampling-comparison-gcc-${{ matrix.std }}
          path: sampling-comparisons/
          if-no-files-found: ignore

  clang:
    needs: [header-generation-ubuntu, header-generation-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        std: [c++17, c++20, c++23]
    steps:
      - uses: actions/checkout@v4
