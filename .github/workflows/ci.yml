      - name: Build & Test (C++23 with doctest, assertions enabled)
        if: matrix.std == 'c++23'
        run: |
          clang++-18 -std=c++23 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx test_randx.cpp
          ./test_randx
      - name: Build & Test (C++23 with doctest, release mode)
        if: matrix.std == 'c++23'
        run: |
          clang++-18 -std=c++23 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_release test_randx.cpp
          ./test_randx_release
      - name: Build & Test (C++17 with doctest, assertions enabled)
        if: matrix.std == 'c++17'
        run: |
          clang++-18 -std=c++17 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++17 with doctest, release mode)
        if: matrix.std == 'c++17'
        run: |
          clang++-18 -std=c++17 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Build & Test (C++20 char8_t coverage, assertions enabled)
        if: matrix.std == 'c++20'
        run: |
          clang++-18 -std=c++20 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
