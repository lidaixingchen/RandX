            variant="cpp17"
            hook_flags=(-DRANDX_ENABLE_ENTROPY_TEST_HOOKS -DRANDX_ENTROPY_TEST_CPP17 -DRANDX_DEFAULT_ENGINE_TEST_CPP17)
          fi
          for build_mode in debug release; do
