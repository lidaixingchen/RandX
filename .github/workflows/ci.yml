            fi
            binary="default-engine-build/test_default_engine_${build_mode}"
            clang++-18 -std='${{ matrix.std }}' -O2 "${mode_flags[@]}" -Wall -Wextra -pthread \
              -I . -I third_party "${entry_flags[@]}" \
              -o "$binary" "$entry" tests/default_engine/default_engine_cross_translation_unit.cpp
            "$binary"
            "$binary" --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          done
      - name: Build and run entropy failure tests
        run: |
