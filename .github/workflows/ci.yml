name: CI

on:
  push:
    branches: [master]
    paths:
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'test_randx.cpp'
      - 'test_randx_cpp17.cpp'
      - 'gen_parity_sequences.cpp'
      - 'gen_sequences.cpp'
      - 'examples/**'
      - 'example.cpp'
      - 'benchmark.cpp'
      - 'benchmark_gbench.cpp'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/**'
      - 'tools/**'
      - 'third_party/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'test_randx.cpp'
      - 'test_randx_cpp17.cpp'
      - 'gen_parity_sequences.cpp'
      - 'gen_sequences.cpp'
      - 'examples/**'
      - 'example.cpp'
      - 'benchmark.cpp'
      - 'benchmark_gbench.cpp'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/**'
      - 'tools/**'
      - 'third_party/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# 固定 doctest 用例排序种子，只控制执行顺序，不参与 RandX 引擎播种。
env:
  RANDX_DOCTEST_ORDER_SEED: '20261001'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PractRand driver test suite
        run: |
          python3 -m unittest discover \
            -s tools/pract_rand/tests \
            -p 'test_*.py' -v
      - name: Run contract registry checker unit tests
        run: python3 -m unittest discover -s tools -p 'test_check_test_contracts.py' -v

  gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        std: [c++17, c++20, c++23]
    steps:
      - uses: actions/checkout@v4
      - name: Check GCC 14
        run: g++-14 --version
      - name: Build & Test (C++23 with doctest, assertions enabled)
        if: matrix.std == 'c++23'
        run: |
          g++-14 -std=c++23 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx test_randx.cpp
          ./test_randx
          g++-14 -std=c++23 -O2 -Wall -Wextra -o benchmark benchmark.cpp
      - name: Build & Test (C++23 with doctest, release mode)
        if: matrix.std == 'c++23'
        run: |
          g++-14 -std=c++23 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_release test_randx.cpp
          ./test_randx_release
      - name: Build & Test (C++17 with doctest, assertions enabled)
        if: matrix.std == 'c++17'
        run: |
          g++-14 -std=c++17 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++17 with doctest, release mode)
        if: matrix.std == 'c++17'
        run: |
          g++-14 -std=c++17 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Build & Test (C++20 char8_t coverage, assertions enabled)
        if: matrix.std == 'c++20'
        run: |
          g++-14 -std=c++20 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++20 char8_t coverage, release mode)
        if: matrix.std == 'c++20'
        run: |
          g++-14 -std=c++20 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Run tests with fixed randomized order
        run: |
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            ./test_randx --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
            ./test_randx_release --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          else
            ./test_randx_cpp17 --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
            ./test_randx_cpp17_release --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          fi
      - name: Collect registry manifests
        run: |
          mkdir -p contracts
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            target="test_randx"
            variant="cpp23"
          else
            target="test_randx_cpp17"
            variant="cpp17"
          fi
          python3 tools/check_test_contracts.py collect \
            --binary "./${target}" --compiler gcc-14 --platform ubuntu-24.04 \
            --standard "${{ matrix.std }}" --build-mode debug --variant "${variant}" \
            --output "contracts/gcc-${{ matrix.std }}-debug-${variant}.json"
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            target="test_randx_release"
            variant="cpp23"
          else
            target="test_randx_cpp17_release"
            variant="cpp17"
          fi
          python3 tools/check_test_contracts.py collect \
            --binary "./${target}" --compiler gcc-14 --platform ubuntu-24.04 \
            --standard "${{ matrix.std }}" --build-mode release --variant "${variant}" \
            --output "contracts/gcc-${{ matrix.std }}-release-${variant}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-contracts-gcc-${{ matrix.std }}
          path: contracts/*.json

  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        std: [c++17, c++20, c++23]
    steps:
      - uses: actions/checkout@v4
      - name: Check Clang 18
        run: clang++-18 --version
      - name: Build & Test (C++23 with doctest, assertions enabled)
        if: matrix.std == 'c++23'
        run: |
          clang++-18 -std=c++23 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx test_randx.cpp
          ./test_randx
      - name: Build & Test (C++23 with doctest, release mode)
        if: matrix.std == 'c++23'
        run: |
          clang++-18 -std=c++23 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_release test_randx.cpp
          ./test_randx_release
      - name: Build & Test (C++17 with doctest, assertions enabled)
        if: matrix.std == 'c++17'
        run: |
          clang++-18 -std=c++17 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++17 with doctest, release mode)
        if: matrix.std == 'c++17'
        run: |
          clang++-18 -std=c++17 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Build & Test (C++20 char8_t coverage, assertions enabled)
        if: matrix.std == 'c++20'
        run: |
          clang++-18 -std=c++20 -O2 -D_GLIBCXX_ASSERTIONS -Wall -Wextra -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
          ./test_randx_cpp17
      - name: Build & Test (C++20 char8_t coverage, release mode)
        if: matrix.std == 'c++20'
        run: |
          clang++-18 -std=c++20 -O2 -DNDEBUG -Wall -Wextra -I third_party \
            -o test_randx_cpp17_release test_randx_cpp17.cpp
          ./test_randx_cpp17_release
      - name: Run tests with fixed randomized order
        run: |
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            ./test_randx --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
            ./test_randx_release --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          else
            ./test_randx_cpp17 --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
            ./test_randx_cpp17_release --order-by=rand --rand-seed="${RANDX_DOCTEST_ORDER_SEED}"
          fi
      - name: Collect registry manifests
        run: |
          mkdir -p contracts
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            target="test_randx"
            variant="cpp23"
          else
            target="test_randx_cpp17"
            variant="cpp17"
          fi
          python3 tools/check_test_contracts.py collect \
            --binary "./${target}" --compiler clang-18 --platform ubuntu-24.04 \
            --standard "${{ matrix.std }}" --build-mode debug --variant "${variant}" \
            --output "contracts/clang-${{ matrix.std }}-debug-${variant}.json"
          if [[ "${{ matrix.std }}" == "c++23" ]]; then
            target="test_randx_release"
            variant="cpp23"
          else
            target="test_randx_cpp17_release"
            variant="cpp17"
          fi
          python3 tools/check_test_contracts.py collect \
            --binary "./${target}" --compiler clang-18 --platform ubuntu-24.04 \
            --standard "${{ matrix.std }}" --build-mode release --variant "${variant}" \
            --output "contracts/clang-${{ matrix.std }}-release-${variant}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-contracts-clang-${{ matrix.std }}
          path: contracts/*.json

  msvc:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      matrix:
        std: [c++17, c++20, c++23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      - name: Build (C++23 with doctest)
        if: matrix.std == 'c++23'
        shell: cmd
        run: cl /std:c++23preview /utf-8 /W4 /EHsc /Od /I third_party /Fe:test_randx.exe test_randx.cpp
      - name: Test (C++23 with doctest)
        if: matrix.std == 'c++23'
        timeout-minutes: 3
        shell: cmd
        run: test_randx.exe
      - name: Build & Test (C++23 with doctest, release mode)
        if: matrix.std == 'c++23'
        timeout-minutes: 5
        shell: cmd
        run: |
          cl /std:c++23preview /utf-8 /W4 /EHsc /O2 /DNDEBUG /I third_party /Fe:test_randx_release.exe test_randx.cpp
          test_randx_release.exe
      - name: Build quick benchmark
        if: matrix.std == 'c++23'
        shell: cmd
        run: cl /std:c++23preview /utf-8 /W4 /EHsc /O2 /Fe:benchmark.exe benchmark.cpp
      - name: Build (C++17 with doctest)
        if: matrix.std == 'c++17'
        shell: cmd
        run: cl /std:c++17 /utf-8 /W4 /EHsc /Od /I third_party /Fe:test_randx_cpp17.exe test_randx_cpp17.cpp
      - name: Test (C++17 with doctest)
        if: matrix.std == 'c++17'
        timeout-minutes: 3
        shell: cmd
        run: test_randx_cpp17.exe
      - name: Build & Test (C++17 with doctest, release mode)
        if: matrix.std == 'c++17'
        timeout-minutes: 5
        shell: cmd
        run: |
          cl /std:c++17 /utf-8 /W4 /EHsc /O2 /DNDEBUG /I third_party /Fe:test_randx_cpp17_release.exe test_randx_cpp17.cpp
          test_randx_cpp17_release.exe
      - name: Build (C++20 char8_t coverage)
        if: matrix.std == 'c++20'
        shell: cmd
        run: cl /std:c++20 /utf-8 /W4 /EHsc /Od /I third_party /Fe:test_randx_cpp17.exe test_randx_cpp17.cpp
      - name: Test (C++20 char8_t coverage)
        if: matrix.std == 'c++20'
        timeout-minutes: 3
        shell: cmd
        run: test_randx_cpp17.exe
      - name: Run tests with fixed randomized order (C++17)
        if: matrix.std == 'c++17'
        shell: cmd
        run: |
          test_randx_cpp17.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
          test_randx_cpp17_release.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
      - name: Run tests with fixed randomized order (C++20)
        if: matrix.std == 'c++20'
        shell: cmd
        run: test_randx_cpp17.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED%
      - name: Run tests with fixed randomized order (C++23)
        if: matrix.std == 'c++23'
        shell: cmd
        run: |
          test_randx.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
          test_randx_release.exe --order-by=rand --rand-seed=%RANDX_DOCTEST_ORDER_SEED% || exit /b
      - name: Collect registry manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path contracts | Out-Null
          $standard = '${{ matrix.std }}'
          if ($standard -eq 'c++23') {
            $target = 'test_randx.exe'
            $variant = 'cpp23'
          } else {
            $target = 'test_randx_cpp17.exe'
            $variant = 'cpp17'
          }
          python tools/check_test_contracts.py collect --binary $target --compiler msvc --platform windows-2025 --standard $standard --build-mode debug --variant $variant --output "contracts/msvc-$standard-debug-$variant.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($standard -ne 'c++20') {
            if ($standard -eq 'c++23') {
              $target = 'test_randx_release.exe'
              $variant = 'cpp23'
            } else {
              $target = 'test_randx_cpp17_release.exe'
              $variant = 'cpp17'
            }
            python tools/check_test_contracts.py collect --binary $target --compiler msvc --platform windows-2025 --standard $standard --build-mode release --variant $variant --output "contracts/msvc-$standard-release-$variant.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: test-contracts-msvc-${{ matrix.std }}
          path: contracts/*.json

  # 跨标准序列一致性检查：同一生成器分别以 C++23（RandX.hpp）与
  # C++17（RandX_Cpp17.hpp）编译，固定种子输出各引擎与便捷 API 序列后逐字节比对，
  # 机械保证「双头文件输出序列完全一致」不变量（KAT 测试保持不变，独立于本 job）
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check GCC 14
        run: g++-14 --version
      - name: Build parity generators (C++23 + C++17)
        run: |
          g++-14 -std=c++23 -O2 -Wall -Wextra \
            -o gen_parity_cpp23 gen_parity_sequences.cpp
          g++-14 -std=c++17 -O2 -Wall -Wextra -DRANDX_PARITY_CPP17 \
            -o gen_parity_cpp17 gen_parity_sequences.cpp
      - name: Generate & compare sequences byte-by-byte
        run: |
          ./gen_parity_cpp23 > seq_cpp23.txt
          ./gen_parity_cpp17 > seq_cpp17.txt
          cmp seq_cpp23.txt seq_cpp17.txt
          echo "Cross-standard sequences are byte-identical ($(wc -c < seq_cpp23.txt) bytes)"
      - name: Upload sequences on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-sequences
          path: |
            seq_cpp23.txt
            seq_cpp17.txt

  # 示例编译冒烟检查：以 -DRANDX_BUILD_EXAMPLES=ON 构建 examples/ 全部示例
  # 与 gen_sequences.cpp，仅验证可编译，不运行
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check GCC 14
        run: g++-14 --version
      - name: Configure & build examples
        run: |
          cmake -B build -DRANDX_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: |
          g++-14 --version
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Build with coverage
        run: |
          g++-14 -std=c++23 -O0 -g --coverage -I third_party \
            -o test_randx test_randx.cpp
          g++-14 -std=c++17 -O0 -g --coverage -I third_party \
            -o test_randx_cpp17 test_randx_cpp17.cpp
      - name: Run tests
        run: |
          ./test_randx
          ./test_randx_cpp17
      - name: Generate coverage report
        run: |
          # 使用 gcov-14 以匹配 g++-14 生成的 .gcda 格式（B43*），避免与系统 gcov-13（B33*）冲突
          lcov --capture --directory . --output-file coverage.info --gcov-tool gcov-14 --branch-coverage
          lcov --remove coverage.info '/usr/*' '*/third_party/*' '*/test_randx.cpp' '*/test_randx_cpp17.cpp' '*/tests/*' --output-file coverage.info --gcov-tool gcov-14 --branch-coverage
          lcov --list coverage.info --branch-coverage
          lcov --summary coverage.info --branch-coverage
      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage.info --branch-coverage | grep -oP 'lines\.*:\s*\K[0-9.]+')
          echo "Line coverage: ${COVERAGE}%"
          awk "BEGIN { exit !(${COVERAGE} >= 80) }" || (echo "Coverage ${COVERAGE}% < 80%" && exit 1)
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./coverage.info
          fail_ci_if_error: false

  test-contracts:
    needs: [gcc, clang, msvc]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test registration manifest checker
        run: python3 -m unittest discover -s tools -p test_check_test_contracts.py
      - uses: actions/download-artifact@v4
        with:
          pattern: test-contracts-*
          path: contracts
          merge-multiple: true
      - name: Compare matrix registration manifests
        run: |
          python3 tools/check_test_contracts.py compare --manifest-dir contracts \
            --expected-group gcc-14 ubuntu-24.04 debug \
            --expected-group gcc-14 ubuntu-24.04 release \
            --expected-group clang-18 ubuntu-24.04 debug \
            --expected-group clang-18 ubuntu-24.04 release \
            --expected-group msvc windows-2025 debug \
            --expected-group msvc windows-2025 release
