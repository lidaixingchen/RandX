name: Packaging Validation

# 触发条件：仅手动触发。
# 原因：git archive 内嵌 commit hash，移动 tag 后 tarball SHA 必变，
# tag 触发的 CI checkout 到 tag 本身，portfile 中 SHA 永远滞后一步（循环依赖）。
# workflow_dispatch checkout 默认分支（master），portfile SHA 已更新，可正常验证。
# vcpkg 官方 ports / xmake-repo 都不接受 CI 自动推送，本工作流仅做本地预演，
# 验证 port 能在新版本上正常构建，提示维护者手动提交 PR。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "待验证版本（留空时使用当前包版本，填写时省略 v 前缀）"
        required: false

permissions:
  contents: read

jobs:
  vcpkg-validate:
    name: vcpkg port
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ver = "$env:INPUT_VERSION"
          if ([string]::IsNullOrEmpty($ver)) {
            $ver = (Get-Content ports/randx/vcpkg.json | ConvertFrom-Json).version
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify port version matches tag
        shell: pwsh
        env:
          TAG_VER: ${{ steps.ver.outputs.version }}
        run: |
          $portVer = (Get-Content ports/randx/vcpkg.json | ConvertFrom-Json).version
          $tagVer = "$env:TAG_VER"
          if ($portVer -ne $tagVer) {
            Write-Error "Version mismatch: ports/randx/vcpkg.json=$portVer vs tag=$tagVer"
            exit 1
          }
          Write-Host "Port version $portVer matches tag $tagVer"

      - name: Install vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11
        with:
          vcpkgGitCommitId: "d99b2e01ef73a34daa2e6ef7983c70a890d9f31b"

      - name: Install randx via overlay port
        # --classic: 项目根 vcpkg.json 会让 vcpkg 进入 manifest mode，
        # classic mode 强制按命令行参数安装
        run: |
          vcpkg install randx --classic `
            --overlay-ports=ports `
            --triplet x64-windows

      - name: Verify headers installed
        shell: pwsh
        run: |
          $inc = "$env:VCPKG_ROOT/installed/x64-windows/include"
          foreach ($h in @("RandX.hpp", "RandX_Cpp17.hpp")) {
            if (-not (Test-Path "$inc/$h")) {
              Write-Error "Header not installed: $h (looked in $inc)"
              exit 1
            }
            Write-Host "OK: $h installed"
          }

  xrepo-validate:
    name: xmake-repo port
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14 (for C++23 support required by RandX.hpp on_test)
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a  # v1
        with:
          xmake-version: latest

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            PORT_VER=$(python3 -c 'import json; print(json.load(open("ports/randx/vcpkg.json"))["version"])')
            echo "version=$PORT_VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify port version matches tag
        env:
          TAG_VER: ${{ steps.ver.outputs.version }}
        run: |
          PORT_VER=$(grep -E '^\s*add_versions' packaging/xmake-repo/packages/r/randx/xmake.lua | head -1 | sed -E 's/.*add_versions\("([^"]+)".*/\1/')
          echo "Port version: $PORT_VER"
          echo "Tag version:   $TAG_VER"
          if [ "$PORT_VER" != "$TAG_VER" ]; then
            echo "::error::Version mismatch: xmake.lua=$PORT_VER vs tag=$TAG_VER"
            exit 1
          fi

      - name: Register local xmake-repo
        run: |
          xrepo add-repo local-randx "$PWD/packaging/xmake-repo"

      - name: Install randx via xrepo (triggers on_test snippet compile)
        env:
          CC: gcc-14
          CXX: g++-14
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          xrepo install -y "local-randx@randx $PACKAGE_VERSION"

      - name: Verify headers installed
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          xrepo fetch --json "local-randx@randx $PACKAGE_VERSION" | python3 -c '
          import json
          import pathlib
          import sys

          package, = json.load(sys.stdin)
          include_dirs = package.get("includedirs", [])
          if isinstance(include_dirs, str):
              include_dirs = [include_dirs]
          headers = ("RandX.hpp", "RandX_Cpp17.hpp")
          for include_dir in map(pathlib.Path, include_dirs):
              if all((include_dir / header).is_file() for header in headers):
                  for header in headers:
                      print(f"OK: {include_dir / header}")
                  break
          else:
              sys.exit("::error::目标版本的安装目录缺少 RandX 头文件")
          '

  summary:
    name: Summary
    needs: [vcpkg-validate, xrepo-validate]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Print result
        run: |
          echo "## Packaging Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| vcpkg port     | ${{ needs.vcpkg-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| xmake-repo port | ${{ needs.xrepo-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If both jobs succeeded, please manually submit PRs to:" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/microsoft/vcpkg (copy \`ports/randx/\` and run \`vcpkg x-add-version randx\`)" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/xmake-io/xmake-repo (copy \`packaging/xmake-repo/packages/r/randx/\`)" >> $GITHUB_STEP_SUMMARY
