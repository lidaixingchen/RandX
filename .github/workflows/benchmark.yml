name: Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'benchmark_gbench.cpp'
      - 'CMakeLists.txt'
      - 'src/header_sources/**'
      - 'tools/generate_headers.py'
      - '.gitattributes'
      - 'tools/compare_benchmark.py'
      - 'tools/test_compare_benchmark.py'
      - 'tools/merge_benchmark_repetitions.py'
      - 'tools/test_merge_benchmark_repetitions.py'
      - 'tools/confirm_sampling_benchmark.py'
      - 'tools/test_confirm_sampling_benchmark.py'
      - 'tools/benchmark_policy.json'
      - 'tools/benchmark_gate.py'
      - 'tools/benchmark_actions.py'
      - 'tools/run_benchmark_group.py'
      - 'tools/test_benchmark_gate.py'
      - 'tools/test_benchmark_actions.py'
      - 'tools/test_run_benchmark_group.py'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [master]
    paths:
      - 'RandX.hpp'
      - 'RandX_Cpp17.hpp'
      - 'benchmark_gbench.cpp'
      - 'CMakeLists.txt'
      - 'src/header_sources/**'
      - 'tools/generate_headers.py'
      - '.gitattributes'
      - 'tools/compare_benchmark.py'
      - 'tools/test_compare_benchmark.py'
      - 'tools/merge_benchmark_repetitions.py'
      - 'tools/test_merge_benchmark_repetitions.py'
      - 'tools/confirm_sampling_benchmark.py'
      - 'tools/test_confirm_sampling_benchmark.py'
      - 'tools/benchmark_policy.json'
      - 'tools/benchmark_gate.py'
      - 'tools/benchmark_actions.py'
      - 'tools/run_benchmark_group.py'
      - 'tools/test_benchmark_gate.py'
      - 'tools/test_benchmark_actions.py'
      - 'tools/test_run_benchmark_group.py'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      validation_scenario:
        description: '平台故障演练场景'
        type: choice
        options: [group_failure, download_failure, evaluate_exception, cancelled, refresh]
        required: true
      force_update_baseline:
        description: '强制更新基准测试基线'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: benchmark-${{ github.ref }}-${{ inputs.validation_scenario }}
  cancel-in-progress: true

jobs:
  benchmark_plan:
    name: Plan benchmark run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan_valid: ${{ steps.plan.outputs.plan_valid }}
      mode: ${{ steps.plan.outputs.mode }}
      baseline_name: ${{ steps.plan.outputs.baseline_name }}
      candidate_commit: ${{ steps.plan.outputs.candidate_commit }}
      baseline_commit: ${{ steps.plan.outputs.baseline_commit }}
      sampling_commit: ${{ steps.plan.outputs.sampling_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated refresh policy
        if: inputs.validation_scenario == 'refresh'
        run: python tools/exercise_benchmark_platform.py policy
      - name: Capture benchmark context
        id: context
        if: always() && !cancelled()
        env:
          BENCHMARK_REPOSITORY: ${{ github.repository }}
          BENCHMARK_REPOSITORY_ID: ${{ github.repository_id }}
          BENCHMARK_EVENT: ${{ github.event_name }}
          BENCHMARK_REF: ${{ github.ref }}
          BENCHMARK_RUN_ID: ${{ github.run_id }}
          BENCHMARK_RUN_ATTEMPT: ${{ github.run_attempt }}
          BENCHMARK_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCHMARK_FORK_PR: 'true'
          BENCHMARK_FORCE_UPDATE_BASELINE: ${{ inputs.force_update_baseline == true || inputs.force_update_baseline == 'true' }}
          BENCHMARK_CANCELLED: 'false'
        run: python -X utf8 tools/benchmark_actions.py context --output benchmark-context.json
      - name: Query all baseline artifacts and runs
        id: query
        if: always() && !cancelled() && steps.context.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -X utf8 tools/benchmark_actions.py query
          --policy tools/benchmark_policy.json
          --context benchmark-context.json
          --output baseline-query.json
      - name: Create benchmark plan
        id: plan
        if: always() && !cancelled()
        run: |
          python -X utf8 tools/benchmark_gate.py plan \
            --policy tools/benchmark_policy.json \
            --context benchmark-context.json \
            --query baseline-query.json \
            --output benchmark-plan.json \
            --github-output "$GITHUB_OUTPUT"
          python -X utf8 tools/benchmark_actions.py plan-outputs \
            --plan benchmark-plan.json --github-output "$GITHUB_OUTPUT"
      - name: Upload benchmark plan
        if: always() && !cancelled() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: |
            benchmark-context.json
            baseline-query.json
            benchmark-plan.json
          if-no-files-found: warn

  measure_general:
    name: Measure general benchmark
    needs: benchmark_plan
    if: needs.benchmark_plan.outputs.plan_valid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout_candidate
        with:
          ref: ${{ needs.benchmark_plan.outputs.candidate_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download benchmark plan
        id: download_plan
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: plan_artifact
      - name: Initialize group records
        id: init_group
        run: python -X utf8 tools/run_benchmark_group.py init --plan plan_artifact/benchmark-plan.json --group general
      - name: Build candidate benchmark
        id: build_candidate
        run: python -X utf8 tools/run_benchmark_group.py build --plan plan_artifact/benchmark-plan.json --group general --variant candidate
      - name: Enumerate candidate benchmark suite
        id: enumerate_candidate
        run: python -X utf8 tools/run_benchmark_group.py enumerate --plan plan_artifact/benchmark-plan.json --group general --variant candidate
      - name: Measure candidate benchmark
        id: measure_candidate
        run: python -X utf8 tools/run_benchmark_group.py measure --plan plan_artifact/benchmark-plan.json --group general --variant candidate
      - name: Checkout baseline commit
        id: checkout_baseline
        if: needs.benchmark_plan.outputs.mode == 'COMPARE'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.benchmark_plan.outputs.baseline_commit }}
          path: baseline-src
      - name: Build baseline benchmark
        id: build_baseline
        if: needs.benchmark_plan.outputs.mode == 'COMPARE'
        run: python -X utf8 tools/run_benchmark_group.py build --plan plan_artifact/benchmark-plan.json --group general --variant baseline
      - name: Enumerate baseline benchmark suite
        id: enumerate_baseline
        if: needs.benchmark_plan.outputs.mode == 'COMPARE'
        run: python -X utf8 tools/run_benchmark_group.py enumerate --plan plan_artifact/benchmark-plan.json --group general --variant baseline
      - name: Measure baseline benchmark
        id: measure_baseline
        if: needs.benchmark_plan.outputs.mode == 'COMPARE'
        run: |
          python -X utf8 tools/run_benchmark_group.py measure --plan plan_artifact/benchmark-plan.json --group general --variant baseline
          if [ "${{ inputs.validation_scenario }}" = 'group_failure' ]; then
            exit 2
          fi
      - name: Collect group metadata
        if: always() && !cancelled()
        env:
          BENCHMARK_STEPS_JSON: ${{ toJSON(steps) }}
        run: >-
          python -X utf8 tools/benchmark_actions.py collect-group
          --plan plan_artifact/benchmark-plan.json --group general
          --groups-directory groups --steps-json "$BENCHMARK_STEPS_JSON"
      - name: Upload general benchmark results and logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-general
          path: groups/general/
          if-no-files-found: warn

  measure_sampling_cpp17:
    name: Measure C++17 sampling benchmark
    needs: benchmark_plan
    if: needs.benchmark_plan.outputs.plan_valid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout_candidate
        with:
          ref: ${{ needs.benchmark_plan.outputs.candidate_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download benchmark plan
        id: download_plan
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: plan_artifact
      - name: Initialize group records
        id: init_group
        run: python -X utf8 tools/run_benchmark_group.py init --plan plan_artifact/benchmark-plan.json --group sampling_cpp17
      - name: Build candidate C++17 sampling benchmark
        id: build_candidate
        run: python -X utf8 tools/run_benchmark_group.py build --plan plan_artifact/benchmark-plan.json --group sampling_cpp17 --variant candidate
      - name: Enumerate candidate C++17 sampling suite
        id: enumerate_candidate
        run: python -X utf8 tools/run_benchmark_group.py enumerate --plan plan_artifact/benchmark-plan.json --group sampling_cpp17 --variant candidate
      - name: Checkout sampling baseline headers
        id: checkout_baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.benchmark_plan.outputs.sampling_commit }}
          path: sampling-baseline-src
      - name: Build baseline C++17 sampling benchmark
        id: build_baseline
        run: python -X utf8 tools/run_benchmark_group.py build --plan plan_artifact/benchmark-plan.json --group sampling_cpp17 --variant baseline
      - name: Enumerate baseline C++17 sampling suite
        id: enumerate_baseline
        run: python -X utf8 tools/run_benchmark_group.py enumerate --plan plan_artifact/benchmark-plan.json --group sampling_cpp17 --variant baseline
      - name: Measure alternating C++17 sampling rounds
        id: measure_sampling_rounds
        run: python -X utf8 tools/run_benchmark_group.py measure --plan plan_artifact/benchmark-plan.json --group sampling_cpp17
      - name: Prepare fixed confirmation suspects
        if: inputs.validation_scenario == 'refresh'
        run: python tools/exercise_benchmark_platform.py suspects sampling_cpp17
      - name: Aggregate C++17 sampling rounds
        id: aggregate
        run: python -X utf8 tools/run_benchmark_group.py aggregate --plan plan_artifact/benchmark-plan.json --group sampling_cpp17
      - name: Confirm C++17 sampling regressions
        id: confirm
        run: python -X utf8 tools/run_benchmark_group.py confirm --plan plan_artifact/benchmark-plan.json --group sampling_cpp17
      - name: Collect group metadata
        if: always() && !cancelled()
        env:
          BENCHMARK_STEPS_JSON: ${{ toJSON(steps) }}
        run: >-
          python -X utf8 tools/benchmark_actions.py collect-group
          --plan plan_artifact/benchmark-plan.json --group sampling_cpp17
          --groups-directory groups --steps-json "$BENCHMARK_STEPS_JSON"
      - name: Upload C++17 sampling results and logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-sampling_cpp17
          path: groups/sampling_cpp17/
          if-no-files-found: warn

  measure_sampling_cpp23:
    name: Measure C++23 sampling benchmark
    needs: benchmark_plan
    if: needs.benchmark_plan.outputs.plan_valid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout_candidate
        with:
          ref: ${{ needs.benchmark_plan.outputs.candidate_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download benchmark plan
        id: download_plan
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: plan_artifact
      - name: Initialize group records
        id: init_group
        run: python -X utf8 tools/run_benchmark_group.py init --plan plan_artifact/benchmark-plan.json --group sampling_cpp23
      - name: Build candidate C++23 sampling benchmark
        id: build_candidate
        run: python -X utf8 tools/run_benchmark_group.py build --plan plan_artifact/benchmark-plan.json --group sampling_cpp23 --variant candidate
      - name: Enumerate candidate C++23 sampling suite
        id: enumerate_candidate
        run: python -X utf8 tools/run_benchmark_group.py enumerate --plan plan_artifact/benchmark-plan.json --group sampling_cpp23 --variant candidate
      - name: Checkout sampling baseline headers
        id: checkout_baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.benchmark_plan.outputs.sampling_commit }}
          path: sampling-baseline-src
      - name: Build baseline C++23 sampling benchmark
        id: build_baseline
        run: python -X utf8 tools/run_benchmark_group.py build --plan plan_artifact/benchmark-plan.json --group sampling_cpp23 --variant baseline
      - name: Enumerate baseline C++23 sampling suite
        id: enumerate_baseline
        run: python -X utf8 tools/run_benchmark_group.py enumerate --plan plan_artifact/benchmark-plan.json --group sampling_cpp23 --variant baseline
      - name: Measure alternating C++23 sampling rounds
        id: measure_sampling_rounds
        run: python -X utf8 tools/run_benchmark_group.py measure --plan plan_artifact/benchmark-plan.json --group sampling_cpp23
      - name: Prepare fixed confirmation suspects
        if: inputs.validation_scenario == 'refresh'
        run: python tools/exercise_benchmark_platform.py suspects sampling_cpp23
      - name: Aggregate C++23 sampling rounds
        id: aggregate
        run: python -X utf8 tools/run_benchmark_group.py aggregate --plan plan_artifact/benchmark-plan.json --group sampling_cpp23
      - name: Confirm C++23 sampling regressions
        id: confirm
        run: python -X utf8 tools/run_benchmark_group.py confirm --plan plan_artifact/benchmark-plan.json --group sampling_cpp23
      - name: Collect group metadata
        if: always() && !cancelled()
        env:
          BENCHMARK_STEPS_JSON: ${{ toJSON(steps) }}
        run: >-
          python -X utf8 tools/benchmark_actions.py collect-group
          --plan plan_artifact/benchmark-plan.json --group sampling_cpp23
          --groups-directory groups --steps-json "$BENCHMARK_STEPS_JSON"
      - name: Upload C++23 sampling results and logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-sampling_cpp23
          path: groups/sampling_cpp23/
          if-no-files-found: warn

  benchmark:
    name: Benchmark
    needs: [benchmark_plan, measure_general, measure_sampling_cpp17, measure_sampling_cpp23]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download benchmark plan
        id: download_plan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-plan
          path: benchmark-plan
      - name: Download general benchmark group
        id: download_general
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.validation_scenario == 'download_failure' && 'exercise-missing-artifact' || format('benchmark-{0}-{1}-general', github.run_id, github.run_attempt) }}
          path: groups/general
      - name: Download C++17 sampling group
        id: download_sampling_cpp17
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-sampling_cpp17
          path: groups/sampling_cpp17
      - name: Download C++23 sampling group
        id: download_sampling_cpp23
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-sampling_cpp23
          path: groups/sampling_cpp23
      - name: Record execution and download outcomes
        id: execution
        if: always() && !cancelled()
        env:
          BENCHMARK_NEEDS_JSON: ${{ toJSON(needs) }}
          BENCHMARK_STEPS_JSON: ${{ toJSON(steps) }}
          BENCHMARK_PLAN_DOWNLOAD: ${{ steps.download_plan.outcome }}
          BENCHMARK_PLAN_JOB_RESULT: ${{ needs.benchmark_plan.result }}
        run: >-
          python -X utf8 tools/benchmark_actions.py execution
          --plan-job "$BENCHMARK_PLAN_JOB_RESULT"
          --plan-download "$BENCHMARK_PLAN_DOWNLOAD"
          --needs-json "$BENCHMARK_NEEDS_JSON"
          --steps-json "$BENCHMARK_STEPS_JSON"
          --output execution.json
      - name: Create error plan when plan artifact is unavailable
        id: fallback_plan
        if: always() && !cancelled()
        env:
          BENCHMARK_REPOSITORY: ${{ github.repository }}
          BENCHMARK_REPOSITORY_ID: ${{ github.repository_id }}
          BENCHMARK_EVENT: ${{ github.event_name }}
          BENCHMARK_REF: ${{ github.ref }}
          BENCHMARK_RUN_ID: ${{ github.run_id }}
          BENCHMARK_RUN_ATTEMPT: ${{ github.run_attempt }}
          BENCHMARK_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCHMARK_FORK_PR: 'true'
          BENCHMARK_FORCE_UPDATE_BASELINE: ${{ inputs.force_update_baseline == true || inputs.force_update_baseline == 'true' }}
          BENCHMARK_CANCELLED: 'false'
        run: |
          if [ ! -f benchmark-plan/benchmark-plan.json ]; then
            python -X utf8 tools/benchmark_actions.py fallback-inputs \
              --context-output benchmark-plan/context.json \
              --query-output benchmark-plan/baseline-query.json
            python -X utf8 tools/benchmark_gate.py plan \
              --policy tools/benchmark_policy.json \
              --context benchmark-plan/context.json \
              --query benchmark-plan/baseline-query.json \
              --output benchmark-plan/benchmark-plan.json
          fi
      - name: Evaluate benchmark gate
        id: evaluate
        if: always() && !cancelled()
        run: |
          if [ "${{ inputs.validation_scenario }}" = 'evaluate_exception' ]; then
            python -c "raise RuntimeError('平台演练：求值程序异常')"
          fi
          python -X utf8 tools/benchmark_gate.py evaluate \
            --plan benchmark-plan/benchmark-plan.json \
            --execution execution.json \
            --groups-dir groups \
            --output benchmark-gate.json \
            --summary benchmark-summary.md \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload benchmark gate report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-report
          path: |
            benchmark-gate.json
            benchmark-summary.md
            execution.json
          if-no-files-found: ignore
      - name: Create issue for classified performance regression
        if: >-
          !cancelled() &&
          steps.evaluate.outcome == 'success' &&
          steps.evaluate.outputs.report_ready == 'true' &&
          steps.evaluate.outputs.notify_regression == 'true' &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('benchmark-gate.json', 'utf8'));
            if (report.report_ready !== true || report.notify_regression !== true) {
              core.setFailed('门禁报告没有提供有效的回归通知资格。');
              return;
            }
            const date = new Date().toISOString().slice(0, 10);
            const titlePrefix = '[Benchmark 回归]';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'benchmark',
              per_page: 20
            });
            const duplicate = issues.find(issue => issue.title.startsWith(titlePrefix));
            if (duplicate) {
              core.info(`已有未关闭 issue #${duplicate.number}，跳过创建。`);
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = report.regressions.map(entry => {
              const tolerance = report.policy.groups[entry.group].tolerance;
              return `- ${entry.group}：${entry.items.length} 项有效回归，容差 ${(tolerance * 100).toFixed(1)}%。`;
            }).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${date}`,
              body: `性能门禁结论：${report.status}。\n\n${summary}\n\n完整用例、测量值和其他组错误见 [workflow run 的门禁报告](${runUrl})。`,
              labels: ['performance', 'benchmark']
            });
      - name: Prepare baseline artifact
        if: >-
          success() && !cancelled() &&
          needs.measure_general.result == 'success' &&
          needs.measure_sampling_cpp17.result == 'success' &&
          needs.measure_sampling_cpp23.result == 'success' &&
          steps.evaluate.outputs.report_ready == 'true' &&
          steps.evaluate.outputs.publish_baseline == 'true'
        run: >-
          python -X utf8 tools/benchmark_actions.py prepare-baseline
          --groups-directory groups
          --report benchmark-gate.json
          --summary benchmark-summary.md
          --output-directory baseline-release
      - name: Upload accepted benchmark baseline
        if: >-
          success() && !cancelled() &&
          needs.measure_general.result == 'success' &&
          needs.measure_sampling_cpp17.result == 'success' &&
          needs.measure_sampling_cpp23.result == 'success' &&
          steps.evaluate.outputs.report_ready == 'true' &&
          steps.evaluate.outputs.publish_baseline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.benchmark_plan.outputs.baseline_name }}
          path: baseline-release/
          if-no-files-found: error
      - name: Return benchmark gate result
        if: always() && !cancelled()
        env:
          BENCHMARK_REPORT_READY: ${{ steps.evaluate.outputs.report_ready }}
          BENCHMARK_EXIT_CODE: ${{ steps.evaluate.outputs.exit_code }}
        run: >-
          python -X utf8 tools/benchmark_actions.py finish
          --report benchmark-gate.json
          --report-ready "$BENCHMARK_REPORT_READY"
          --exit-code "$BENCHMARK_EXIT_CODE"
